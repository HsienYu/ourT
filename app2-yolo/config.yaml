# App 2 — YOLO Camera Configuration

camera:
  source: webcam          # webcam | ndi | syphon
  webcam_index: 0
  ndi_source_name: ""     # NDI source name, e.g. "MY-COMPUTER (Camera)"
  width: 1280
  height: 720
  fps_target: 30

yolo:
  model: yolo26n.pt       # yolo26n (fast) | yolo26s | yolo26m (accurate)
  confidence: 0.45
  device: ""              # "" = auto (MPS on Apple Silicon, CUDA if available, else CPU)

# Each detected tracker ID keeps one label from this list while tracked.
